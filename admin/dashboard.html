<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 · 文章管理</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- 顶部栏 -->
  <header class="admin-header">
    <div class="admin-header-inner">
      <a href="dashboard.html" class="admin-brand">申论阅读站 · 管理后台</a>
      <div class="admin-user">
        <span id="current-user"></span>
        <button id="logout-btn" class="btn-text">退出</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <!-- 工具栏 -->
    <div class="toolbar">
      <h2>文章列表</h2>
      <div class="toolbar-actions">
        <input type="text" id="search" placeholder="搜索标题..." class="input-search">
        <button id="new-article-btn" class="btn-primary">+ 新建文章</button>
      </div>
    </div>

    <!-- 文章列表表格 -->
    <table class="article-table">
      <thead>
        <tr>
          <th>标题</th>
          <th>分类</th>
          <th>序号</th>
          <th>日期</th>
          <th>作者</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="article-tbody">
        <tr><td colspan="6" class="table-loading">加载中...</td></tr>
      </tbody>
    </table>
  </main>

  <!-- 文章编辑弹窗 -->
  <div id="editor-modal" class="modal" style="display:none">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h3 id="editor-title">新建文章</h3>
        <button class="modal-close" data-close>×</button>
      </div>
      <form id="article-form" class="article-form">
        <input type="hidden" id="article-id">
        <div class="form-row">
          <div class="form-group">
            <label for="f-title">标题 *</label>
            <input type="text" id="f-title" required>
          </div>
          <div class="form-group form-group-small">
            <label for="f-slug">slug（留空自动生成）</label>
            <input type="text" id="f-slug">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group form-group-small">
            <label for="f-category">分类</label>
            <input type="text" id="f-category" value="申论">
          </div>
          <div class="form-group form-group-small">
            <label for="f-order">序号</label>
            <input type="number" id="f-order" value="999">
          </div>
          <div class="form-group form-group-small">
            <label for="f-date">日期</label>
            <input type="text" id="f-date" placeholder="如 2024-06-15">
          </div>
          <div class="form-group form-group-small">
            <label for="f-author">作者</label>
            <input type="text" id="f-author">
          </div>
        </div>
        <div class="form-group">
          <label for="f-description">摘要</label>
          <textarea id="f-description" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label for="f-content">正文 HTML</label>
          <textarea id="f-content" rows="18" class="code-textarea" placeholder="直接粘贴文章 HTML 正文..."></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-text" data-close>取消</button>
          <button type="submit" class="btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
